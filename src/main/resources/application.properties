spring.application.name=LoanManagementAppApplication
spring.config.import=optional:file:.env[.properties]

# Local DB
# spring.datasource.url=jdbc:mysql://localhost:3306/loan_management_app
# spring.datasource.username=root
# spring.datasource.password=database

# Database (RDS)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&verifyServerCertificate=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Lambda Optimization
spring.main.web-application-type=servlet
spring.main.lazy-initialization=true

# JWT
jwt.secret=${JWT_SECRET:yourSuperSecretKeyForJwtGeneration123456}
jwt.expiration=86400000

# AWS Configuration (S3 for Receipt Storage)
aws.accessKey=${My_AWS_ACCESS_KEY}
aws.secretKey=${My_AWS_SECRET_KEY}
aws.region=${My_AWS_REGION}
aws.bucketName=${My_AWS_BUCKET_NAME:loan-doc-storage}

# ==================== PAYMENT GATEWAY CONFIGURATION ====================

# Razorpay Payment Gateway (Production Level)
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# Application Callback URL (for payment confirmations)
app.callback.url=${APP_CALLBACK_URL:http://localhost:8080}

# Payment Gateway Settings
payment.gateway.enabled=true
payment.gateway.default=razorpay
payment.gateway.timeout=30000

# Loan Risk Model
loan.risk.model.enabled=${LOAN_RISK_MODEL_ENABLED:true}
loan.risk.model.url=${LOAN_RISK_MODEL_URL:}
loan.risk.model.token=${LOAN_RISK_MODEL_TOKEN:}

# Reminder Scheduler
reminder.scheduler.enabled=${REMINDER_SCHEDULER_ENABLED:true}
reminder.schedule.timezone=${REMINDER_SCHEDULE_TIMEZONE:Asia/Kolkata}

# Twilio reminders
reminder.twilio.enabled=${REMINDER_TWILIO_ENABLED:true}
# Keep SMS as the safe default for scheduled reminders. WhatsApp free-form messages are session-limited.
reminder.twilio.channel=${REMINDER_TWILIO_CHANNEL:SMS}
reminder.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
reminder.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
reminder.twilio.from-number=${TWILIO_PHONE_NUMBER:}

# Customer OTP verification
otp.verification.enabled=${OTP_VERIFICATION_ENABLED:true}
otp.verification.expiry-minutes=${OTP_VERIFICATION_EXPIRY_MINUTES:10}

# ========================================================================
# NOTE: Receipts are now stored in S3 bucket (loan-doc-storage)
# Path: s3://loan-doc-storage/receipts/YYYY/MM/RECEIPT_NUMBER.html
# Local filesystem storage has been replaced with AWS S3
# ========================================================================
