name: Deploy Spring Boot to Lambda

on:
  push:
    branches:
      - dev
      - dev-v3

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LoanManagementApp

    steps:
      # 🧾 Checkout code
      - name: Checkout code
        uses: actions/checkout@v5

      # ☕ Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 📦 Build project
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 🔍 Verify Java version (debug safety)
      - name: Verify compiled Java version
        run: |
          javap -verbose target/classes/com/example/LoanManagementApp/StreamLambdaHandler.class | grep "major"

      # ☁️ Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ap-south-1

      # 🏷️ Generate versioned filename
      - name: Set build version
        id: vars
        run: echo "VERSION=$(date +%s)" >> $GITHUB_ENV

      # 📤 Upload JAR to S3
      - name: Upload to S3
        run: |
          aws s3 cp target/LoanManagementApp-0.0.1-SNAPSHOT.jar s3://${{ secrets.S3_BUCKET }}/lambda/app-${VERSION}.jar

      # 🚀 Deploy to Lambda
      - name: Update Lambda Function
        working-directory: .
        run: |
          aws lambda update-function-code --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} --s3-bucket ${{ secrets.S3_BUCKET }} --s3-key lambda/app-${VERSION}.jar
          aws lambda wait function-updated --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }}
          aws lambda get-function --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} --query 'Configuration.[FunctionName,LastModified,Version]' --output table
